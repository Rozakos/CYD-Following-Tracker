<!DOCTYPE html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>CYD Follower Tracker</title><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--action:#1f6feb}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:520px;margin:0 auto;padding:0;background:var(--bg);color:var(--text);min-height:100vh}main{padding:16px}h1{font-size:20px;margin:8px 0 4px}h2{font-size:11px;margin:22px 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}th{padding:9px 12px;background:#1c2128;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);text-align:left;font-weight:600}td{padding:10px 12px;border-top:1px solid var(--border)}input,button,select{padding:9px 11px;font-size:15px;border-radius:6px;border:1px solid var(--border);background:#0d1117;color:var(--text);font-family:inherit}input:focus,select:focus{outline:none;border-color:var(--accent)}button{background:var(--action);border-color:var(--action);cursor:pointer;font-weight:600;color:white}button.del{background:#c0392b;border-color:#c0392b;padding:6px 10px}form.inline{margin:0}form.add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}form.add input,form.add select{min-width:0}form.add button{flex-shrink:0}.empty{opacity:.55;font-style:italic;text-align:center}.banner{background:#2d0e0e;border:1px solid #8c1a1a;color:#ffb3b3;padding:10px 14px;border-radius:6px;margin-top:14px;font-size:14px}label{display:block;margin:18px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}.set input,.set select{width:100%}.set button{width:100%;margin-top:18px;padding:11px}.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}.hint code{background:var(--card);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--accent)}</style></head><body><main><h1>Follower Tracker</h1><div class=banner>No API token set.</div><form class=set method='POST' action='/settings'><label>Refresh interval</label><input name=refresh_s type=number min='15' value='600' required><div class=hint>Seconds between refreshes (server caches ~10 min).</div><label>API token</label><input name=api_key value='' placeholder='paste your bearer token'><label>List window (delta shown per row)</label><select name=list_range><option value='1w' selected>1 week</option><option value='1mo'>1 month</option><option value='3mo'>3 months</option><option value='1y'>1 year</option><option value='max'>All time</option></select><label>Primary account (hero view)</label><select name=primary><option value='' selected>None</option><option value='youtube|@mkbhd'>youtube|@mkbhd</option><option value='twitch|pokimane'>twitch|pokimane</option><option value='youtube|@veritasium'>youtube|@veritasium</option></select><button type=submit>Save settings</button></form><h2>Tracked accounts</h2><div style='overflow-x:auto'><table><tr><th>Platform</th><th>Handle</th><th></th></tr><tr><td>YouTube</td><td>@mkbhd</td><td><form class=inline method='POST' action='/delete'><input type=hidden name=i value='0'><button class=del type=submit>&times;</button></form></td></tr><tr><td>Twitch</td><td>pokimane</td><td><form class=inline method='POST' action='/delete'><input type=hidden name=i value='1'><button class=del type=submit>&times;</button></form></td></tr><tr><td>YouTube</td><td>@veritasium</td><td><form class=inline method='POST' action='/delete'><input type=hidden name=i value='2'><button class=del type=submit>&times;</button></form></td></tr></table></div><h2>Add account</h2><form class=add method='POST' action='/add'><select name=platform required><option value='youtube'>YouTube</option><option value='twitch'>Twitch</option><option value='instagram'>Instagram</option><option value='tiktok'>TikTok</option><option value='x'>X</option></select><input name=handle placeholder='@handle or id' maxlength=64 required><button type=submit>Add</button></form><div class=hint>Platforms come from the server's <code>/platforms</code> endpoint &mdash; new ones appear here automatically, no reflash.</div></main></body></html>
